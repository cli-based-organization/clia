type: feat
scope: journalisation
sujet: "session, tâche et log deviennent des ressources, journalisées au fil de l'eau"
corps: |
  Exécute la tâche 25 de la session du 2026-08-09, quatre défauts constatés
  et huit correctifs proposés par l'humain.

  Trois types sont créés. LOG est point-fixe et en édition ia : un log
  constate un moment, le modifier serait falsifier. TSK et SES sont des
  composites au sens de ADR-004 D3 : une tâche est un répertoire contenant
  tous les logs de cette tâche et rien d'autre.

  Sept types de log, avec un numéro fixe pour toutes les tâches qui estime
  l'ordre de génération. Le nom de fichier porte la session, la tâche, le
  type, l'horodatage à la minute et un slug, ce qui donne quatre
  informations lisibles sans ouvrir un fichier. L'ancien format en donnait
  une seule.

  MET-003 fixe le procédé, et son apport est le moment d'écriture de chaque
  log. Le procédé existait ; le moment n'était pas fixé. L'étape 3 change le
  plus : le log fait n'est plus écrit une fois à la fin, il est versé à
  mesure que les livrables sortent.

  Les six modes d'échec de la méthodologie citent des cas mesurés du journal
  existant, non des cas imaginés : onze tâches journalisées en bloc à la
  clôture, trois fichiers combinant plusieurs tâches, une démarche de
  validation écrite après les contrôles, un nommage sans date.

  Le journal de cette tâche est la première instance du format, et il a été
  écrit au fil de l'eau. Ses cinq horodatages sont distincts et croissants,
  09:06, 09:07, 09:13, 09:16 et 09:30, dont deux versements du log fait. Des
  horodatages identiques auraient signalé une reconstruction.

  Les sept skills portent désormais une rubrique de journalisation renvoyant
  à MET-003, avec la table des sept moments d'écriture.

  124 tests verts. 125 ressources sur 130 valident leur schéma, les cinq
  échecs étant des gabarits en attente de leur initiateur. Aucun log de
  l'ancien format n'a été migré, renommé ni supprimé.
note_pour_l_humain: >-
  Les quatre défauts que vous constatez portent sur un journal que j'ai
  produit, et le plus grave est vérifiable : les tâches 14 à 24 ont été
  journalisées en bloc à la clôture, y compris le fichier nommé demande qui
  prétendait rendre compte de l'interprétation initiale. Trois fichiers
  combinent même plusieurs tâches.
  Deux choses restent ouvertes et vous appartiennent. Le dépôt porte
  maintenant deux formats de journal et deux répertoires de session : je n'ai
  rien migré, parce que migrer les noms supposerait d'inventer des
  horodatages que rien ne connaît, ce qui contredirait votre défaut D3. Et la
  règle centrale de MET-003, écrire au moment de l'exécution, n'est
  vérifiable par rien : les horodatages sont déclaratifs. NON-028 porte les
  deux.
