note_pour_l_humain: >-
  NON-014 est bloquante et sa question Q1 est la moins coûteuse de toute la
  session : assumer par écrit que clia abandonne l'unicité globale transforme
  une propriété perdue par inadvertance en une propriété écartée par
  décision. Les cinq premières suggestions de ANL-003 ne demandent aucun code
  et règlent trois questions ouvertes. Votre NON-013 n'a pas été touché. Le
  versionnage reste la responsabilité de l'humain.
