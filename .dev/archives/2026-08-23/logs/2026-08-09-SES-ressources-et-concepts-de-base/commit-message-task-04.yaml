note_pour_l_humain: >-
  Une ligne de la tâche 4 est restée inachevée : "les ressources créés par".
  ADR-002 a été écrit sans elle et rien ne garantit qu'il ne la contredit
  pas. La compléter est le geste le plus rentable de la suite. NON-009 est
  bloquant et porte notamment l'ambiguïté du point d'entrée, qui n'avait
  jamais été objectée formellement. Le versionnage reste la responsabilité
  de l'humain.
