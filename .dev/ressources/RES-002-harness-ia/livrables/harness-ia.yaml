# La définition de la ressource « harness-ia ».
#
# Elle porte ce que les commandes de clia savent tenir aujourd'hui, et rien
# de plus : un champ qu'aucune commande n'emploie serait une promesse que le
# système ne tient pas.
#
# Ce qui se range à côté de ce fichier :
#
#   _scripts/     les automatismes qu'elle fournit — hrn.sh y porte
#                 la commande « clia hrn »
#   primitives/   ce à partir de quoi ses livrables sont produits
#   skills/       les procédures qu'elle fournit

nom: harness-ia
titre: Harnais IA
prefixe: HRN
version: 0.1.0

description: "Harnais IA : les instructions qui guident agents et automatismes dans un dépôt clia."

# La zone où le dépôt écrit ses harnais — SES-001 tâche 21.
zones:
  - nom: harnais
    defaut: .dev/harnais-ia
    description: "les données des harnais IA du dépôt, et ce qui en est généré"
