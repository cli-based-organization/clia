# derive-de : TSK-07-commit-message_2026-08-13-12-49_focus-et-fonctionnalites.yaml
# Le premier message a ete ecrit avant que la tache soit interrompue. Celui-ci
# le remplace : il couvre la reprise, la correction de focus.sh et l'epreuve
# du critere de PLN-013. MET-003 R2 : un log ne se reecrit pas, il se derive.
type: feat
portee: cli
sujet: "clia focus, l'état qui varie, et le type Fonctionnalité"
corps: |
  Exécution des quatre plans issus de ANL-011, huit chantiers.

  clia focus répond à « que dois-je faire maintenant ? » en nommant une
  action et la commande qui l'exécuterait. Il agrège les items ouverts du
  dépôt en cinq catégories avec leur destinataire, et désigne le plus
  prioritaire. La sortie tient en huit lignes.

  Aucun item ouvert ne disparaît, quel que soit son état. Le premier jet ne
  traitait que les valeurs attendues : trois items étaient invisibles, dont
  BUG-001, un bogue rapporté par l'humain. Seuls les états clos déclarés par
  le schéma font disparaître un item ; un état absent ou non renseigné range
  l'item à défricher en nommant le défaut. Le compteur passe donc de 55 à 58
  items en attente : il monte, et c'est le chiffre juste.

  clia res ls TYPE affiche enfin le champ d'état qui varie, déduit des champs
  obligatoires que chaque définition déclare : etat pour l'objection,
  statut-plan pour le plan, effet pour la décision. Onze types sur
  trente-huit en ont un. C'est ISU-008, ouverte le 2026-08-11 à la demande de
  l'humain et redemandée le 13.

  Le type Fonctionnalité donne au dépôt sa première unité de produit : tout
  le reste — plan, issue, objection, bogue — nomme un problème. Sept
  instances décrivent ce que clia fait, chacune avec sa rubrique « Comment
  s'en servir ». Les quatorze plans déclarent désormais la fonctionnalité
  qu'ils servent.

  MET-005 fixe la conduite de l'exécution d'un plan : aucune méthodologie ne
  la couvrait. Son étape 1 porte la correction de BUG-002 — le type de la
  tâche commande, un plan neuf reste propose. Son étape 2 porte le filtre de
  PLN-013 entre ce qui se décide en avançant et ce qui doit s'arrêter. Son
  étape 4 porte la directive de la tâche 9 : dire les fonctionnalités
  livrées et comment s'en servir.

  Ce filtre a été éprouvé sur les 39 objections du dépôt, rangées une à une
  par jugement et non par recherche de mots : 26 devaient s'arrêter, 12
  pouvaient avancer, 1 n'est pas une objection. Près d'un tiers des
  objections ouvertes en cinq jours n'avaient pas lieu d'être.

  275 assertions, 252 à l'ouverture de la session.
note_pour_l_humain: |
  Le compteur monte de 55 à 58 : trois items étaient cachés par un défaut de
  focus.sh, dont BUG-001 que vous venez d'inscrire en tâche 10.
