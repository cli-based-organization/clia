type: docs
scope: analyses
sujet: "ANL-001 observation du corpus de dépôts et des pratiques de travail"
corps: |
  Produit l'analyse critique du corpus complet des 166 dépôts git sous
  $HOME/git, demandée par la tâche 1 de la session du 2026-08-09.

  Bundle .dev/analyses/ANL-001-observation-corpus-repos-et-pratiques/ :
  inventaire mécanique des 166 dépôts en YAML, description et analyse
  critique de chaque dépôt en quatre fichiers, observations sur la manière
  de travailler de l'humain, analyse critique transversale en dix défauts
  mesurés, et état de la matière disponible pour les onze ressources
  annoncées par CLAUDE.md.

  Constats principaux : douze numéros de skill sur vingt portent plusieurs
  noms distincts selon le dépôt, ce qui invalide la désignation des
  ressources par triplet de numéros ; trente-trois CLAUDE.md du corpus
  portent dix-huit contenus différents sans mécanisme de propagation ;
  trois dépôts de consultation partagent le même INTENTION.md et les mêmes
  traces, désignant le mauvais client ; RES-001-ressource.md, le meilleur
  travail conceptuel du corpus, vit dans un dépôt de candidature sans
  remote.

  Journalisation dans .dev/logs/2026-08-09-SES-ressources-et-concepts-de-base/.

  Aucune ressource fondamentale produite : la description de la tâche
  demande l'observation, pas la conception.
