type: docs
scope: ressources
sujet: "premier jet des sept ressources fondamentales et huit objections"
corps: |
  Produit le premier jet de description des sept ressources fondamentales
  demandé par la tâche 2 de la session du 2026-08-09, à partir des constats
  de ANL-001.

  .dev/ressources/ : RES-001 Ressource, RES-002 Contexte, RES-003 Intention,
  RES-004 Objection, RES-005 Faits, RES-006 Ontologie, RES-007 Concept, plus
  un index. Sept types, sept préfixes distincts, quatorze champs de
  frontmatter, toutes en status draft.

  .dev/objections/ : huit objections thématiques, NON-001 à NON-008,
  cinquante-six questions au total. Trois sont bloquantes : identité et
  nommage, coût du modèle, validation et règles non tenues.

  Cinq apports de conception fondés sur des mesures de ANL-001 :
  l'identité est le champ id de forme PREFIXE-SLUG et non le numéro de
  séquence ; l'intention porte un critère de satisfaction et un critère de
  trahison, sans quoi l'objection pour conflit d'intention est impossible à
  instruire ; l'objection déclare son effet, bloquant, conditionnel ou
  informatif ; l'unité de fichier des faits est le recueil par sujet ; le
  concept porte un seuil d'admission à trois conditions.

  Trois écarts assumés avec RES-001 de micrologic-clients, qui est la
  référence du corpus : l'identité stable est retenue alors que la référence
  l'écarte, l'ontologie passe en co-édition, et le préfixe de l'objection
  est NON conformément à CLAUDE.md.

  Contradiction interne assumée et signalée : les définitions emploient six
  relations dont le vocabulaire vit provisoirement dans RES-001, alors qu'il
  relève de l'ontologie. ONT-001 n'existe pas. Porté par NON-004 Q2.

  Journalisation dans
  .dev/logs/2026-08-09-SES-ressources-et-concepts-de-base/, fichiers
  suffixés -task-02.

  Ni ADR ni skill produits : la demande porte sur les RES.
