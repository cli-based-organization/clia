note_pour_l_humain: >-
  Le critère de convergence de la session est atteint sur ses trois termes :
  le concept de ressource est défini par RES-001, utilisable par skl-001, et
  instrumenté depuis cette tâche. Reste non instrumentée la validation : les
  neuf contrôles de skl-001 sont encore des commandes à lancer à la main, et
  ADR-003 D9 en fait le cahier des charges d'une commande à venir. Un effet
  de bord des essais manuels, un fichier de configuration créé dans
  ~/.config/clia/, a été nettoyé. Le versionnage reste la responsabilité de
  l'humain.
