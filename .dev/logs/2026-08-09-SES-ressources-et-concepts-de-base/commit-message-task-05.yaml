note_pour_l_humain: >-
  La réponse à la question posée est : clia reste ici. Elle contredit le
  précédent le plus visible du corpus, et porte pour cette raison son propre
  critère de renversement. Le geste le plus urgent qu'elle révèle n'est pas
  un choix de dépôt : le setup.sh a été archivé le 2026-08-08 et le dépôt
  n'est plus ni installable ni vérifiable. Le versionnage reste la
  responsabilité de l'humain.
